[package]
name = "edl"
version = "1.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/GabuGravin41/EDL"
description = "Engineering Description Language (EDL) v1.2 — multi-domain Architecture + Building Electrical (MEP) + Electronics CAD/EDA, SPICE/MNA & MCP"

[dependencies]
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
