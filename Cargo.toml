[package]
name = "edl"
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/GabuGravin41/EDL"
description = "Engineering Description Language (EDL) v2.0 — native KiCad 9 electronics schematics + AutoCAD DXF building/industrial electrical with formal verification, MNA simulation & MCP"

[dependencies]
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
