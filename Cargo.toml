[package]
name = "edl"
version = "3.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/GabuGravin41/EDL"
description = "Engineering Description Language (EDL) v3.0 — AI-native coordinate-free intent compiler (idioms, pin-anchored relative solver, short-free A* router, semantic KiCad lifter + .edl.layout lockfiles) with real KiCad 9 ERC & formal proofs"

[dependencies]
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
