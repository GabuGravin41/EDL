[package]
name = "edl"
version = "3.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/GabuGravin41/EDL"
description = "Engineering Description Language (EDL) v3.1 — AI-native coordinate-free intent compiler with Rust-style non-negotiable invariants (E1-E12 + real KiCad 9 ERC), structured repair suggestions, hierarchical nets, and semantic KiCad lifting"

[dependencies]
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
