[package]
name = "edl"
version = "2.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/GabuGravin41/EDL"
description = "Engineering Description Language (EDL) v2.1 — lossless Two-Layer KiCad 9 electronics (36/36 official demos 100% round-trip verified) + building/industrial electrical with formal proofs & MCP"

[dependencies]
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
