name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust-check-and-test:
    name: Build, Lint & Test (0 Warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Compile library, binary, and all tests with -D warnings
        run: cargo check --all-targets

      - name: Run full Rust test suite
        run: cargo test

      - name: Verify Canonical IR JSON Schema is up to date
        run: |
          cargo build
          ./target/debug/edl schema > /tmp/generated_schema.json
          diff -u docs/canonical_ir.schema.json /tmp/generated_schema.json

      - name: Run Python adapter tests
        run: python3 adapters/test_adapters.py
